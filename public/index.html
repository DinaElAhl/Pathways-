/* Roots | جذور — green, coral, cream */
:root{--navy:#22423a;--teal:#2f8f5b;--gold:#f07a5f;--bg:#fff8ee;--line:#efe2cf;--muted:#6d7b70;--red:#c84f3d;--mint:#e3f4e8;--coral:#f07a5f;--cream:#fff8ee}
body{background:var(--cream);color:var(--navy)}
header{background:#fffdf8;border-bottom:3px solid var(--coral);box-shadow:0 3px 14px #6b4a2a10;padding-top:max(15px,env(safe-area-inset-top))}
.brand{display:flex;align-items:center;gap:10px}
.brandline{display:block;font-family:'EB Garamond',Georgia,serif;font-size:24px;font-weight:700;color:#2f8f5b;letter-spacing:-.3px;line-height:1.05}
.brandline .ar{font-family:'Amiri',serif;color:var(--coral)}
.tagline{display:block;font-size:12px;color:#7b6a55;font-weight:600;letter-spacing:.3px}
aside{background:linear-gradient(170deg,#2f8f5b 0%,#277a4e 60%,#22423a 100%)}
aside .small{color:#fff3df;font-weight:800;font-size:13px;line-height:1.4}
nav button{color:#effaf2;border-radius:11px;transition:background .15s}
nav button:hover{background:#ffffff22}
nav button.active{background:#fff8ee;color:#22423a;border-inline-start:4px solid var(--coral);box-shadow:0 4px 12px #0b2a1a33}
button:not(.secondary):not(.warn){background:#2f8f5b;border-color:#2f8f5b;color:#fff}
button:not(.secondary):not(.warn):hover{background:#277a4e}
button.secondary{background:#fff;color:#22423a;border-color:#d9c9b0}
button.warn{background:#fff1ec;border-color:#f3c3b5;color:#b2442f}
.card,.panel{background:#fffdf9;border:1px solid var(--line);border-radius:18px;box-shadow:0 6px 18px #6b4a2a0d}
.cards>.card:nth-child(4n+1){background:#e3f4e8;border-color:#c5e8d0}.cards>.card:nth-child(4n+2){background:#ffe9e2;border-color:#f8cfc2}
.cards>.card:nth-child(4n+3){background:#fff1d6;border-color:#f3dfb4}.cards>.card:nth-child(4n+4){background:#eef6f1;border-color:#d4e9dc}
.metric{color:#22423a}.panel h2{color:#2f8f5b}
.pill{background:#e3f4e8;color:#226c43}.pill.gold{background:#fff1d6;color:#8a5b10}.pill.red{background:#ffe2da;color:#a33a26}
.progress>div,.barline span{background:linear-gradient(90deg,#2f8f5b,#f07a5f)}.barline{background:#f1e7d8}.progress{background:#f1e7d8}
.item{border-inline-start:4px solid #2f8f5b;background:#fffdf9}.item:nth-child(2n){border-inline-start-color:var(--coral)}
.notice{background:#fff3e6;border:1px solid #f5d6b5;border-inline-start:5px solid var(--coral);color:#6b4626}
.tabs button.active{background:#22423a;color:#fff;border-color:#22423a}
input:focus,textarea:focus,select:focus{outline:2px solid #8fd3a8;outline-offset:1px}
select:disabled{background:#f6efe4;color:#5f6f63}

.userchip{font-size:12px;color:#4b5d50;background:#e3f4e8;border-radius:100px;padding:6px 10px;white-space:nowrap}
.updates{display:none;position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#22423a;color:#fff;padding:10px 16px;border-radius:100px;font-size:13px;cursor:pointer;z-index:40}
